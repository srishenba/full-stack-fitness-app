<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | MEAL MOVE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<!-- 🔝 Same Navbar -->
<nav class="navbar navbar-light shadow-sm">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
      <img src="./Assets/download (1).png" alt="MEALMOVE Logo">
      <span class="fw-bold logo-text">MEAL MOVE</span>
    </a>

    <!-- Login Button -->
    <a href="login.html" class="btn btn-light btn-sm text-primary">Login</a>

  </div>
</nav>

<!-- Sign Up Section -->
<div class="container d-flex justify-content-center align-items-center" style="height:85vh;">
  <div class="shadow p-4 rounded-4 bg-white" style="width:360px;">

    <h4 class="text-center fw-bold mb-3">Create Account 💪</h4>

    <form id="signupForm" novalidate>

      <!-- Name -->
      <div class="mb-3">
        <input type="text" id="name" class="form-control" placeholder="Full Name">
        <div class="text-danger small mt-1 d-none" id="nameError"></div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email ID">
        <div class="text-danger small mt-1 d-none" id="emailError"></div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="Password">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('password','eye1')">
            <i class="bi bi-eye" id="eye1"></i>
          </button>
        </div>
        <div class="text-danger small mt-1 d-none" id="passwordError"></div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <div class="input-group">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword','eye2')">
            <i class="bi bi-eye" id="eye2"></i>
          </button>
        </div>
        <div class="text-danger small mt-1 d-none" id="confirmError"></div>
      </div>

      <button type="submit" class="btn btn-success w-100">Sign Up</button>

    </form>

  </div>
</div>

<script>
const form = document.getElementById("signupForm");

function togglePassword(fieldId, eyeId){
  const field = document.getElementById(fieldId);
  const eye = document.getElementById(eyeId);

  if(field.type === "password"){
    field.type = "text";
    eye.classList.replace("bi-eye", "bi-eye-slash");
  } else {
    field.type = "password";
    eye.classList.replace("bi-eye-slash", "bi-eye");
  }
}

form.addEventListener("submit", function(e){
  e.preventDefault();

  let isValid = true;

  const name = document.getElementById("name");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");

  const nameError = document.getElementById("nameError");
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const confirmError = document.getElementById("confirmError");

  // Reset
  document.querySelectorAll(".form-control").forEach(el => el.classList.remove("is-invalid"));
  document.querySelectorAll(".text-danger").forEach(el => el.classList.add("d-none"));

  // Name validation
  if(name.value.trim() === ""){
    name.classList.add("is-invalid");
    nameError.innerText = "Name is required";
    nameError.classList.remove("d-none");
    isValid = false;
  }

  // Email validation
  if(email.value.trim() === ""){
    email.classList.add("is-invalid");
    emailError.innerText = "Email is required";
    emailError.classList.remove("d-none");
    isValid = false;
  }

  // Password validation
  if(password.value.length < 6){
    password.classList.add("is-invalid");
    passwordError.innerText = "Password must be at least 6 characters";
    passwordError.classList.remove("d-none");
    isValid = false;
  }

  // Confirm password
  if(confirmPassword.value !== password.value){
    confirmPassword.classList.add("is-invalid");
    confirmError.innerText = "Passwords do not match";
    confirmError.classList.remove("d-none");
    isValid = false;
  }

  if(isValid){

  // Save basic details
  localStorage.setItem("name", name.value);
  localStorage.setItem("email", email.value);
  localStorage.setItem("password", password.value);

  // Go to Step 2 page
  window.location.href = "details.html";
}
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
